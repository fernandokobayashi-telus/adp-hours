<html lang="pt-BR">
<head>

<title>ADP Hours</title>
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 12px 14px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: #0f172a;
    background: #ffffff;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #475569;
  }
  .adp-hours-banner { display: block; padding: 0; margin: 0; background: none; border: none; }
  .adp-hours-line1 { font-weight: 600; font-size: 14px; }
  .adp-hours-line2 { opacity: 0.85; margin-top: 2px; }
  .adp-hours-empty { color: #64748b; }
  .adp-hours-reminder {
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    font-size: 12px;
    line-height: 1.4;
  }

<body>
  <h1>ADP Hours</h1>
